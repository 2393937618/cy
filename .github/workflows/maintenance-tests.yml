name: Network regression tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  network-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Test real network helper without Android SDK or business backend
        run: sh ./gradlew -p maintenance-tests --no-daemon test
