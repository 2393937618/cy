apply plugin: 'java'

sourceCompatibility = 1.8
targetCompatibility = 1.8

repositories {
    mavenCentral()
}

// Compile the real network helper without loading Android or the legacy Mob plugin.
sourceSets {
    main {
        java {
            srcDirs = ['../app/src/main/java']
            include 'com/example/lxc/cy/other/OkhttpHelper.java'
        }
    }
}

dependencies {
    implementation files('../app/libs/gson-2.8.0.jar')
    implementation 'com.squareup.okhttp3:okhttp:3.4.1'
    implementation 'org.json:json:20180813'
    testImplementation 'junit:junit:4.12'
    testImplementation 'com.squareup.okhttp3:mockwebserver:3.4.1'
}

test {
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}
